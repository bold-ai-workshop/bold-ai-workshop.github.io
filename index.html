<script>
  /* stamp the theme before anything paints: stored choice, else system preference */
  (function(){
    var root=document.documentElement, saved=null;
    try{saved=localStorage.getItem('uai-theme');}catch(e){}
    root.setAttribute('data-theme', saved||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'));
  })();
</script>
